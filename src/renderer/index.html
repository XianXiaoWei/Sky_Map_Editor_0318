<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"><title>Sky 地图编辑器</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <div class="brand"><span class="brand-mark">✧</span><div>SKY <span>地图编辑器</span><small>WORLD BUILDER · 0.3.7</small></div></div>
  <div class="level-picker"><small>当前地图</small><select id="levels" aria-label="选择地图"></select></div>
  <nav aria-label="工作模式"><button id="mode-bin" class="active" aria-pressed="true">bin 编辑 <kbd>1</kbd></button><button id="mode-mesh" aria-pressed="false">meshes 编辑 <kbd>2</kbd></button><button id="mode-avatar" aria-pressed="false">Avatar 模式 <kbd>3</kbd></button></nav>
  <div class="header-actions"><button id="resources">资源与类清单</button><button id="settings">⚙ 设置</button><button id="save" class="primary">保存 <kbd>Ctrl S</kbd></button><button id="author" aria-label="作者介绍" aria-haspopup="dialog" aria-controls="author-dialog">作者介绍</button></div>
</header>
<div class="workspace">
  <aside id="left"><div class="panel-heading"><span id="left-title">场景对象</span><span id="object-count" class="badge">0</span></div><input id="search" class="search" placeholder="搜索类名、对象或资源…" aria-label="搜索对象"><div id="tree"></div></aside>
  <main id="viewport"><div class="viewport-toolbar"><div class="segmented"><button id="translate" class="active" title="平移 G">移动 <kbd>G</kbd></button><button id="rotate" title="旋转 R">旋转 <kbd>R</kbd></button><button id="scale" title="缩放 S">缩放 <kbd>S</kbd></button></div><button id="focus">聚焦 <kbd>F</kbd></button><button id="frame">全景 <kbd>Home</kbd></button><button id="wire" aria-pressed="false" title="沿地图实际三角网格叠加边线">地图网格线</button><button id="creature-pause" disabled aria-pressed="true">暂停生物</button><button id="creature-stop" disabled title="停止基础生物移动并还原位置">还原生物</button><button id="helper-frames" aria-pressed="false" title="显示轨道、标记和云代理辅助线框">辅助线框</button><select id="selection-outline" aria-label="选择轮廓"><option value="mesh">选中：沿网格</option><option value="bounds">选中：包围盒</option><option value="hidden">选中：隐藏轮廓</option></select><button id="grid">地面网格</button><button id="physics-ball" hidden aria-pressed="false">线框交互球</button><button id="physics-ball-reset" hidden title="把球放回当前视点">球到视图中心</button><button id="physics-ball-follow" hidden aria-pressed="false">跟随球</button><button id="physics-ball-fly" hidden aria-pressed="false">球飞行</button><button id="undo" title="撤销 Ctrl Z">↶</button><button id="redo" title="重做 Ctrl Shift Z">↷</button></div>
    <div id="physics-ball-status" hidden></div><div id="scene-label"><span class="dot"></span><b id="level-label">未打开地图</b><span id="preview-label">编辑器预览</span><select id="mesh-display" hidden aria-label="Meshes 渲染查看"><option value="material">原版地形材质预览</option></select><button id="material-animation" aria-pressed="true">暂停材质动画</button><select id="bake-channel" hidden aria-label="烘焙通道查看"><option value="-1">正常预览</option></select></div>
    <select id="viewport-quality" aria-label="画面清晰度" title="所有档位保留完整效果。均衡在 67%–100% 分辨率间调节；清晰固定 100%，帧率可能下降。"><option value="smooth">流畅 · 动态分辨率</option><option value="balanced" selected>均衡 · 保留清晰度</option><option value="native">清晰 · 原生 100%</option></select>
    <div id="empty"><div class="empty-symbol">✧</div><h1>从一片天空开始</h1><p>配置 Sky Data 目录，选择地图开始编辑。</p></div>
    <div id="brush-hud" hidden></div>
    <div class="viewport-help">点击视口：WASD 移动 · Q↓ E↑ · 右键拖动看向 · Shift 加速 · 中键旋转 · 滚轮缩放</div>
    <div id="context-menu" hidden><button data-add="plane">新增平面</button><button data-add="box">新增立方体</button><button data-add="sphere">新增球体</button><button id="context-focus">聚焦所选</button></div>
  </main>
  <aside id="right"><div class="panel-heading"><span>属性</span><span id="selection-type" class="badge">未选择</span></div><div id="inspector"><div class="muted placeholder">选择左侧对象或视口中的几何，查看并编辑属性。</div></div></aside>
</div>
<footer><span id="status">就绪</span><span id="stats">—</span><span id="dirty">所有修改已保存</span></footer>
<div id="toast" hidden></div>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>配置游戏目录</h2><button class="close-settings">×</button></div><p class="muted">选择包含 Levels、Meshes、Images 和 Shaders 的 Data 文件夹。首次使用需要完成配置。</p><label>Sky Data 目录</label><div class="path-row"><input id="data-path" placeholder="C:\Sky.app\Contents\Data"><button id="browse">浏览…</button></div><div id="settings-error" class="error"></div><div class="dialog-actions"><button id="apply-settings" class="primary">使用此目录</button></div></dialog>
<dialog id="confirm-dialog"><h2>保留这次编辑吗？</h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-cancel">取消</button><button id="confirm-discard">不保存</button><button id="confirm-save" class="primary">保存</button></div></dialog>
<dialog id="resource-dialog"><div class="dialog-heading"><h2>资源与逆向清单</h2><button id="close-resources">×</button></div><div class="resource-tabs"><button id="tab-folders" class="active">Data 目录</button><button id="tab-materials">材质与变体</button><button id="tab-shaders">着色器</button><button id="tab-classes">原程序类清单</button><button id="tab-lua">Resources.lua</button></div><div id="resource-content"></div></dialog>
<dialog id="author-dialog" aria-labelledby="author-title"><div class="dialog-heading"><h2 id="author-title">作者介绍</h2><button id="close-author" aria-label="关闭作者介绍">×</button></div><div id="author-content"></div><div id="author-appreciation" hidden></div><p id="author-message" role="status" aria-live="polite"></p></dialog>
<script type="module" src="app.js"></script>
</body></html>
